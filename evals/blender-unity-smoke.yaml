scenarios:
  - name: blender-to-unity-level6a
    task: >-
      Execute a real Blender-to-Unity workflow using tools, not a text-only answer.
      Use blender_execute_python to create a cube named HarnessLevel6Cube, save
      artifacts/level6_cube.blend, and export artifacts/level6_cube.fbx.
      Copy the FBX with filesystem_copy to
      unity-level6/Assets/Harness/level6_cube.fbx and explicitly set overwrite=true
      because this eval must be safe to rerun against an existing Level 6A project.
      Use unity_project_info to inspect unity-level6.
      Use unity_execute_editor_script to refresh/import the FBX, create a new
      empty scene, instantiate the imported model as HarnessLevel6Cube at the
      origin, and overwrite/save the scene as Assets/HarnessLevel6.unity.
      Verify by listing the parent directories artifacts,
      unity-level6/Assets/Harness, and unity-level6/Assets. Do not call
      filesystem_list on a file path and do not use shell_run for verification.
      If a tool fails, make at most one targeted correction for that failure.
      Finish with the exact token LEVEL6A_OK only after the workflow has
      actually completed.
    content_contains:
      - LEVEL6A_OK
    required_tools:
      - blender_execute_python
      - filesystem_copy
      - unity_project_info
      - unity_execute_editor_script
      - filesystem_list
    max_steps: 9
    max_tool_errors: 0
