scenarios:
  - name: filesystem-list
    task: >-
      Use filesystem_list on the workspace root before answering. Then briefly report what you found.
    required_tools:
      - filesystem_list
    max_steps: 4
    max_tool_errors: 0

  - name: skill-discovery-and-load
    task: >-
      Use skill_list, then use skill_load to load the browser-research runtime skill before answering.
      Briefly state the main constraint that skill places on browser side effects.
    required_tools:
      - skill_list
      - skill_load
    max_steps: 5
    max_tool_errors: 0

  - name: filesystem-write-read
    task: >-
      Create eval-smoke/hello.txt with the exact text harness-smoke using filesystem_write.
      Read it back with filesystem_read to verify it, then answer with SMOKE_OK.
    content_contains:
      - SMOKE_OK
    required_tools:
      - filesystem_write
      - filesystem_read
    max_steps: 6
    max_tool_errors: 0
