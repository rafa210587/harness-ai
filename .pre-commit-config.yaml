repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pytest-fast
        name: pytest fast suite
        entry: uv run pytest -m "not blender and not unity and not browser_external"
        language: system
        pass_filenames: false
        stages: [pre-push]
