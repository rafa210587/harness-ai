name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format
        run: uv run ruff format --check src tests .claude/hooks

      - name: Ruff lint
        run: uv run ruff check src tests .claude/hooks

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: >-
          uv run pytest -m
          "not blender and not unity and not browser_runtime and not browser_external"

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Verify CLI packaging
        run: uv run harness version

      - name: Pytest core
        run: >-
          uv run pytest -m
          "not blender and not unity and not browser_runtime and not browser_external"
