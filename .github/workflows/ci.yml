name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format
        run: uv run ruff format --check src tests .claude/hooks

      - name: Ruff lint
        run: uv run ruff check src tests .claude/hooks

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: >-
          uv run pytest -m
          "not blender and not unity and not browser_runtime and not browser_external"

      - name: Build distribution
        run: uv build

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/validate-local.ps1",
            "scripts/validate-level6a.ps1",
            "scripts/validate-full-local.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax errors found in $file"
            }
          }

      - name: Seed local environment regression fixture
        shell: pwsh
        run: |
          @"
          DEEPSEEK_API_KEY=ci-dummy-key
          HARNESS_WORKSPACE=./workspace
          "@ | Set-Content .env
          "DEEPSEEK_API_KEY=ci-dummy-key" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HARNESS_WORKSPACE=./workspace" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows core acceptance
        shell: pwsh
        run: .\scripts\validate-local.ps1
