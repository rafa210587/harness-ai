name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format
        run: uv run ruff format --check src tests .claude/hooks

      - name: Ruff lint
        run: uv run ruff check src tests .claude/hooks

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: >-
          uv run pytest -m
          "not blender and not unity and not browser_runtime and not browser_external"

      - name: Build distribution
        run: uv build

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/validate-local.ps1",
            "scripts/validate-level6a.ps1",
            "scripts/validate-full-local.ps1",
            "scripts/validate-opencode.ps1",
            "scripts/prepare-unity-mcp.ps1",
            "scripts/prepare-blender-mcp.ps1",
            "scripts/validate-opencode-deepseek.ps1",
            "scripts/validate-opencode-browser.ps1",
            "scripts/validate-opencode-mcp-candidates.ps1",
            "scripts/validate-opencode-unity.ps1",
            "scripts/validate-opencode-blender.ps1",
            "scripts/validate-opencode-local.ps1",
            "scripts/validate-opencode-security.ps1",
            "scripts/validate-opencode-mock-runtime.ps1",
            "scripts/scan-opencode-cutover-residue.ps1",
            "scripts/validate-opencode-cutover-readiness.ps1",
            "scripts/cutover-opencode-generic-runtime.ps1",
            "scripts/validate-opencode-stage2.ps1",
            "scripts/lib/native.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax errors found in $file"
            }
          }

      - name: Seed local environment regression fixture
        shell: pwsh
        run: |
          @"
          DEEPSEEK_API_KEY=ci-dummy-key
          HARNESS_WORKSPACE=./workspace
          "@ | Set-Content .env
          "DEEPSEEK_API_KEY=ci-dummy-key" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HARNESS_WORKSPACE=./workspace" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows core acceptance
        shell: pwsh
        run: .\scripts\validate-local.ps1


  opencode-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install pinned OpenCode
        shell: pwsh
        run: npm install -g opencode-ai@1.18.31

      - name: Regression test native stderr capture
        shell: pwsh
        run: |
          . .\scripts\lib\native.ps1
          $result = Invoke-NativeCommandCapture -FilePath "node" -Arguments @(
            "-e",
            "console.error('progress-on-stderr'); console.log('ok-on-stdout'); process.exit(0)"
          )
          $result.Output | Write-Host
          if ($result.ExitCode -ne 0) {
            throw "Expected exit code 0, got $($result.ExitCode)."
          }
          if ($result.Output -notmatch "progress-on-stderr" -or $result.Output -notmatch "ok-on-stdout") {
            throw "Native stdout/stderr capture regression."
          }

          $multiArgResult = Invoke-NativeCommandCapture -FilePath "node" -TimeoutSeconds 10 -Arguments @(
            "-e",
            "console.log(process.argv.slice(1).join('|'))",
            "alpha",
            "beta"
          )
          $multiArgResult.Output | Write-Host
          if ($multiArgResult.ExitCode -ne 0 -or $multiArgResult.Output -notmatch "alpha\|beta") {
            throw "Native timeout-mode argument boundary regression."
          }

          $timeoutResult = Invoke-NativeCommandCapture -FilePath "node" -TimeoutSeconds 1 -Arguments @(
            "-e",
            "setTimeout(() => {}, 10000)"
          )
          if (-not $timeoutResult.TimedOut -or $timeoutResult.ExitCode -ne 124) {
            throw "Native timeout regression: expected TimedOut=true and exit code 124."
          }

      - name: Test OpenCode security policy plugin
        shell: pwsh
        run: node --test tests/opencode-policy.test.mjs

      - name: Verify pinned Playwright MCP package exists
        shell: pwsh
        run: |
          $version = (npm view "@playwright/mcp@0.0.81" version).Trim()
          if ($version -ne "0.0.81") {
            throw "Expected @playwright/mcp 0.0.81, got '$version'."
          }

      - name: Validate pinned Unity and Blender MCP entrypoints
        shell: pwsh
        run: .\scripts\validate-opencode-mcp-candidates.ps1

      - name: Validate OpenCode smoke agents are discovered
        shell: pwsh
        run: |
          $previous = $env:OPENCODE_CONFIG_CONTENT
          $env:OPENCODE_CONFIG_CONTENT = '{"mcp":{"playwright":{"enabled":false},"unityMCP":{"enabled":false},"blenderMCP":{"enabled":false}}}'
          try {
            . .\scripts\lib\native.ps1
            $agentResult = Invoke-NativeCommandCapture -FilePath "opencode" -TimeoutSeconds 60 -Arguments @("agent", "list")
            $agents = $agentResult.Output
            $agents | Write-Host
            if ($agentResult.ExitCode -ne 0) {
              throw "opencode agent list failed with exit code $($agentResult.ExitCode)."
            }
            foreach ($name in @("browser-smoke", "unity-smoke", "blender-smoke", "security-smoke", "mock-runtime")) {
              if ($agents -notmatch [regex]::Escape($name)) {
                throw "OpenCode did not discover agent '$name'."
              }
            }
          }
          finally {
            if ($null -eq $previous) {
              Remove-Item Env:OPENCODE_CONFIG_CONTENT -ErrorAction SilentlyContinue
            }
            else {
              $env:OPENCODE_CONFIG_CONTENT = $previous
            }
          }

      - name: Validate OpenCode runtime with local mock provider
        shell: pwsh
        run: .\scripts\validate-opencode-mock-runtime.ps1

      - name: Report OpenCode cutover readiness
        shell: pwsh
        run: .\scripts\validate-opencode-cutover-readiness.ps1

      - name: Dry-run guarded OpenCode cutover
        shell: pwsh
        run: |
          .\scripts\cutover-opencode-generic-runtime.ps1

          $failedAsExpected = $false
          try {
            .\scripts\cutover-opencode-generic-runtime.ps1 -Execute -ConfirmCutover
          }
          catch {
            if ($_.Exception.Message -match "missing local evidence markers") {
              $failedAsExpected = $true
            }
            else {
              throw
            }
          }

          if (-not $failedAsExpected) {
            throw "Cutover guard regression: destructive execution did not refuse missing real-host evidence."
          }
